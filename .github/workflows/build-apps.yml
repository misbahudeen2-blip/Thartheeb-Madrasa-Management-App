name: Build Windows EXE and Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────
  # Windows EXE (unchanged, already working)
  # ─────────────────────────────────────────
  build-windows-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: npx pkg server.js -t node18-win-x64 --output Tartheeb-App.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Tartheeb-Windows-App-EXE
          path: Tartheeb-App.exe

  # ─────────────────────────────────────────
  # Android APK – Bubblewrap (TWA) approach
  # ─────────────────────────────────────────
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Init Bubblewrap TWA Project
        run: |
          mkdir twa-app && cd twa-app
          bubblewrap init \
            --manifest "https://raw.githubusercontent.com/misbahudeen2-blip/Thartheeb-Madrasa-Management-App/main/public/manifest.json" \
            --directory . \
            --skipPwaValidation || true
          cat twa-manifest.json || true

      - name: Build APK with Bubblewrap
        run: |
          cd twa-app
          bubblewrap build --skipPwaValidation || true

      - name: Find APK
        run: find . -name "*.apk" 2>/dev/null || echo "No APK found"

      - uses: actions/upload-artifact@v4
        with:
          name: Tartheeb-Android-App-APK
          path: |
            twa-app/*.apk
            twa-app/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
