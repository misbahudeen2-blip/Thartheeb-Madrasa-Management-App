name: tartheeb_mobile_app
description: "Tartheeb Madrasa Management App - Native Flutter APK"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.5
  google_fonts: ^8.2.1
  font_awesome_flutter: ^11.0.0
  flutter_local_notifications: ^22.2.0
  url_launcher: ^6.3.2
  fl_chart: ^0.70.2
  permission_handler: ^11.3.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/thartheeb-logo.png"
  adaptive_icon_background: "#f6f9ee"
  adaptive_icon_foreground: "assets/images/thartheeb-logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
